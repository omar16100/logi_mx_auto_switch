[project]
name = "logi_mx_auto_switch"
version = "0.2.0"
description = "macOS port of Logitech-MX-Auto-Switch: auto-switch MX Master mouse when MX Keys keyboard Easy-Switches away"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.3; python_version >= '3.10'"]

[tool.pytest.ini_options]
python_classes = ["test_*", "Test*"]
