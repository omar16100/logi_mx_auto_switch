name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # the unit tests use a fake HID transport and never spawn bin/hidapitester,
    # so a Linux runner is enough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: unit tests
        run: uv run --locked pytest -v
